<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48" role="img" aria-label="pixhaus">
  <!--
    Pixhaus wordmark.
    "pixhaus" in Geist Sans weight 600, lowercase, -0.03em letter-spacing.
    The SVG text node inherits color via fill="currentColor".
    Intended usage: embed in dark contexts with light fill, or light contexts with dark fill.
  -->
  <text
    x="0"
    y="36"
    fill="currentColor"
    font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="36"
    font-weight="600"
    letter-spacing="-0.03em"
  >pixhaus</text>
</svg>
