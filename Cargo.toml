[workspace]
resolver = "3"
# No crates yet. This is a clean-slate restart: the native-Rust shell
# (eframe + egui + egui-wgpu) and the wgpu viewport renderer land as their
# own crates when the work defines them. Add each crate here as it appears.
members = []

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Luis <luis@agsense.es>"]
license = "MIT"
repository = "https://github.com/pixhaus-app/pixhaus"
homepage = "https://pixhaus.app"

# Version-stable backbone shared across crates. The egui/wgpu UI stack
# (eframe, egui, egui-wgpu, wgpu, rfd) is intentionally not pinned here yet:
# those versions move in lockstep and are easy to get wrong out of context,
# so pin them in the first crate that depends on them and let the rest follow.
[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
zstd = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Test stack (see pixhaus-testing-conventions).
rstest = "0.26"
proptest = "1"
insta = "1"
tempfile = "3"
mockall = "0.13"
image-compare = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
