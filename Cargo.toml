[workspace]
resolver = "2"
members = [
    "core",
    "io",
    "ai",
    "scripting",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Luis <luis@agsense.es>"]
license = "MIT"
repository = "https://github.com/pixhaus-app/pixhaus"
homepage = "https://pixhaus.app"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
# Pinned exactly because we depend on the Debug format of its private
# `BlendMode` enum (see io/src/psd/spec.rs). A routine `cargo update`
# could silently change those strings; bump the pin deliberately when
# adopting a new version and re-run the blend-mode tests.
psd = "=0.3.5"
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }
flate2 = "1"
futures = "0.3"
color_quant = "1"
gif = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
webp = "0.3"
keyring = "3"
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }
parking_lot = "0.12"
proptest = "1"
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "stream", "rustls-tls", "multipart"] }
thiserror = "2"
sentry = { version = "0.34", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "transport"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
zstd = "0.13"
rstest = "0.23"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12", features = ["serde-compat"] }
palette = "0.7"
zip = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
