[workspace]
resolver = "3"
# The layered crate graph from docs/pixhaus_architecture_bible.md. See CLAUDE.md's
# Repo layout for the trees and the dependency direction. Globs pick up new layer
# crates and modules without editing this list.
members = ["crates/*", "modules/*", "app", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV tracks the pinned toolchain (rust-toolchain.toml), not an older floor: the
# codebase reaches for features stabilized after 1.85 (let-chains and as_chunks at
# 1.88; see the pixhaus-rust-modern skill). This is an app, not a published library,
# so the minimum it builds on is the pin, not a lagging floor. Moves to 1.96 when
# the pin does.
rust-version = "1.95"
authors = ["Luis <luis@agsense.es>"]
license = "MIT"
repository = "https://github.com/pixhaus-app/pixhaus"
homepage = "https://pixhaus.app"

# Version-stable backbone shared across crates. Deliberately minimal: Rust +
# egui/wgpu and nothing else. Add a dependency here only when a crate actually
# needs it — and load the matching `pixhaus-<dep>` skill before reaching for its
# API, since pinned versions drift from training data.
[workspace.dependencies]
# Errors / serde / async backbone.
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Logging sinks the app wires up (app/src/diagnostics.rs): the rolling-file
# appender + its non-blocking writer guard, and the `log`->`tracing` bridge that
# captures wgpu/winit/naga records. Consumed by `app` only.
tracing-appender = "0.2"
tracing-log = "0.2"
# Platform-standard app directories (config/data/cache/log/autosave). Consumed by
# `crates/platform` (the dirs capability); MIT/Apache, clears the deny lock.
directories = "6"
# Localization. `rust-i18n` (MIT) sits behind the Pixhaus localization service
# (`pixhaus_services::i18n`): the `t!` macro + compile-time locale embedding, a
# global active locale, and runtime `set_locale`. The bible's original candidate
# `egui-i18n` is abandoned; this is the deliberate substitute. `sys-locale`
# (MIT/Apache) detects the OS language at boot, consumed by `app`. See the
# `pixhaus-i18n` skill.
rust-i18n = "4"
sys-locale = "0.3"
# OpenRouter image-generation client - the first real AI provider behind the
# capability registry (pixhaus-mod-providers). Pinned to 0.10: its image-generation
# surface (.modalities, .image_config, ContentPart::ImageUrl, message.images) is the
# verified shape the pixhaus-openrouter skill documents, and it drifts across minors.
# Pulls reqwest + a rustls TLS stack transitively. See the pixhaus-openrouter skill.
openrouter-rs = "0.10"
# base64 decode/encode for the data:image/png;base64 payloads OpenRouter returns and
# the anchor reference image we attach. Small, MIT/Apache; consumed by mod-providers.
base64 = "0.22"
# egui / wgpu native UI stack (lockstep — pinned together). wgpu is pinned
# EXACTLY: eframe 0.34 builds against wgpu 29.0.1, and two wgpu versions in the
# tree are incompatible types. See pixhaus-eframe / pixhaus-egui-wgpu.
eframe = { version = "0.34", default-features = false, features = ["wgpu", "persistence"] }
egui = "0.34"
egui_extras = "0.34"
# Phosphor icon glyphs merged into egui's font set (tool-rail glyphs + AI sparkle).
# Ratified in the ui-shell-foundation design; 0.12 declares egui = "0.34".
egui-phosphor = "0.12"
egui-wgpu = "0.34"
wgpu = "=29.0.1"
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
rfd = "0.15"
# Test stack (see pixhaus-testing-conventions).
rstest = "0.26"
# Serializes tests that touch process-global state - `rust-i18n`'s active locale
# is global, so locale-switching tests must not run concurrently with tests that
# assume `en` (nextest runs tests in parallel). See the `pixhaus-i18n` skill.
serial_test = "3"
proptest = "1"
insta = "1"
tempfile = "3"
mockall = "0.13"
image-compare = "0.4"
# Headless UI render harness — rasterizes an egui frame to an image off-screen so we
# can snapshot the shell for visual tuning. egui-family, MIT, pinned in lockstep with
# egui 0.34. The `wgpu` feature installs the off-screen WgpuTestRenderer that
# `Harness::render` needs. See app/examples/render_workspaces.rs.
egui_kittest = { version = "0.34", features = ["wgpu"] }
# `Harness::render` returns an `image::RgbaImage`; we need the crate in scope to save
# it as PNG. Pinned to egui_kittest 0.34's image dependency (0.25).
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
