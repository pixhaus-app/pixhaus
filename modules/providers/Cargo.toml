[package]
name = "pixhaus-mod-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# Registers a Provider into the services registry; builds GeneratedAssets from
# core's pixel invariants. The mock runs as a real tokio task with a cancel token.
pixhaus-core = { path = "../../crates/core" }
pixhaus-services = { path = "../../crates/services" }
# The OpenRouter provider: the client, base64 for the data-URL payloads, image to
# decode/encode PNG, serde_json to read the response's `images` field.
openrouter-rs = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }

[lints]
workspace = true
