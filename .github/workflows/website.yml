name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "brand/**"
      - ".github/workflows/website.yml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "website/**"
      - "brand/**"
      - ".github/workflows/website.yml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm --filter pixhaus-website install --frozen-lockfile

      - name: Type-check
        run: pnpm --filter pixhaus-website typecheck

      - name: Build site
        run: pnpm --filter pixhaus-website build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: website-dist
          path: website/dist
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: pixhaus-app
      url: https://pixhaus.app
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: website/dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist --project-name=pixhaus-app --branch=main
