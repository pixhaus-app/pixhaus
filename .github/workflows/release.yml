name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v0.2.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if [ -f CHANGELOG.md ]; then
            awk -v tag="$TAG" '
              $0 ~ "^## \\[?" substr(tag,2) "\\]?" { in_section=1; next }
              in_section && /^## \[?[0-9v]/ { exit }
              in_section { print }
            ' CHANGELOG.md > release_body.md
          else
            echo "Release $TAG" > release_body.md
          fi

      - name: Create draft release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Pixhaus ${{ steps.tag.outputs.tag }}
          body_path: release_body.md
          draft: true
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            bundles: deb,rpm,appimage
          - os: windows-latest
            name: Windows
            bundles: msi,nsis
          - os: macos-13
            name: macOS Intel
            bundles: dmg,app
          - os: macos-latest
            name: macOS Apple Silicon
            bundles: dmg,app

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: pixhaus-release-${{ matrix.os }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Install Tauri Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf \
            rpm

      - name: Build and upload bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --config app/tauri.conf.json --bundles ${{ matrix.bundles }}
          includeRelease: true
          includeDebug: false

  # TODO(S50): Add code signing (Authenticode/Apple notarization/GPG) and
  # auto-update manifest generation. See docs/planning/work/streams.md#s50.
