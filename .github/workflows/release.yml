name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v0.2.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Strip the leading 'v' for the version field
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if [ -f CHANGELOG.md ]; then
            awk -v tag="$TAG" '
              $0 ~ "^## \\[?" substr(tag,2) "\\]?" { in_section=1; next }
              in_section && /^## \[?[0-9v]/ { exit }
              in_section { print }
            ' CHANGELOG.md > release_body.md
          else
            echo "Release $TAG" > release_body.md
          fi

      - name: Create draft release
        id: release
        uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7 # v2.3.4
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Pixhaus ${{ steps.tag.outputs.tag }}
          body_path: release_body.md
          draft: true
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            bundles: deb,rpm,appimage
          - os: windows-latest
            name: Windows
            bundles: msi,nsis
          - os: macos-13
            name: macOS Intel
            bundles: dmg,app
          - os: macos-latest
            name: macOS Apple Silicon
            bundles: dmg,app

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ". -> target"
          shared-key: pixhaus-release-${{ matrix.os }}

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Install Tauri Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf \
            rpm

      # macOS: import the Developer ID certificate so the Tauri CLI can sign.
      # Requires secrets: APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD.
      - name: Import Apple certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm /tmp/cert.p12

      - name: Build and upload bundle
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Update artifact signing — private key signs the bundle so the
          # updater plugin can verify it against the pubkey in tauri.conf.json.
          # Set TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          # in repository secrets. Generate with: scripts/gen-updater-key.sh
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing and notarization.
          # APPLE_SIGNING_IDENTITY: e.g. "Developer ID Application: Pixhaus (TEAMID)"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Authenticode signing via a PFX certificate.
          # WINDOWS_CERTIFICATE: base64-encoded .pfx file
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --config app/tauri.conf.json --bundles ${{ matrix.bundles }}
          includeRelease: true
          includeDebug: false
          updaterJsonPreferNsis: false

      # Linux AppImage: detached GPG signature for users who verify downloads.
      # Only runs when GPG_PRIVATE_KEY secret is present.
      - name: Sign AppImage with GPG
        if: runner.os == 'Linux' && env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for f in target/release/bundle/appimage/*.AppImage; do
            gpg --batch --yes --armor --detach-sign \
              --local-user "$GPG_KEY_ID" "$f"
            gh release upload "${{ needs.create-release.outputs.tag }}" \
              "${f}.asc" --clobber
          done

  publish:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Download every artifact from the draft release so the manifest
      # script can read the per-platform .sig files.
      - name: Download release artifacts
        run: |
          mkdir -p release-artifacts
          gh release download "${{ needs.create-release.outputs.tag }}" \
            --dir release-artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Generate latest.json from the signed bundles and upload it.
      - name: Generate and upload latest.json
        run: |
          node scripts/gen-update-manifest.mjs \
            --tag "${{ needs.create-release.outputs.tag }}" \
            --version "${{ needs.create-release.outputs.version }}" \
            --artifacts-dir release-artifacts \
            --output latest.json
          gh release upload "${{ needs.create-release.outputs.tag }}" \
            latest.json --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Flip the release from draft to published.
      - name: Publish release
        run: |
          gh release edit "${{ needs.create-release.outputs.tag }}" \
            --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
