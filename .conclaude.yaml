# yaml-language-server: $schema=https://github.com/connerohnesorge/conclaude/releases/latest/download/conclaude-schema.json
#
# Pixhaus conclaude config. Pairs with .claude/settings.json which wires
# conclaude into PreToolUse and Stop. PostToolUse stays on the existing
# scripts/post-edit dispatcher: per-edit fmt + clippy (-D warnings) on the
# touched crate, plus prettier + tsc for TS files. Stop is the full CI mirror.

# Stop hook - runs when Claude declares the session done.
#
# This is the only gate guaranteed to run for every Claude session, regardless
# of git config (the pre-commit git hook only fires when core.hooksPath is wired
# by `pnpm bootstrap`, which a fresh clone or worktree may never have run). So
# Stop mirrors what CI gates a PR on (.github/workflows/ci.yml): a clean session
# should mean green CI. Commands run cheapest-first so a format slip fails fast
# before the heavy build/test steps. RUSTFLAGS=-D warnings matches the
# workspace-wide env CI sets. The lighter pre-PR run lives in scripts/pre-pr.
stop:
  commands:
    - run: "cargo fmt --all -- --check"
      message: "rustfmt: code is not formatted - run `cargo fmt --all` before completing"
      showStdout: true
      showStderr: true
      maxOutputLines: 200

    - run: "RUSTFLAGS='-D warnings' cargo clippy --workspace --all-targets -- -D warnings"
      message: "clippy reported warnings - fix or annotate before completing the session"
      showStdout: true
      showStderr: true
      maxOutputLines: 200

    - run: "RUSTFLAGS='-D warnings' cargo test --workspace --all-targets --no-fail-fast"
      message: "Rust tests failed in the workspace - fix before completing the session"
      showStdout: true
      showStderr: true
      maxOutputLines: 200

    - run: "RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --document-private-items"
      message: "rustdoc failed - broken intra-doc link or missing docs; fix before completing"
      showStdout: true
      showStderr: true
      maxOutputLines: 200

    - run: "cargo deny check --config .cargo/deny.toml"
      message: "cargo-deny: dependency, license, or advisory violation - fix before completing"
      showStdout: true
      showStderr: true
      maxOutputLines: 200

    - run: "pnpm typecheck"
      message: "TypeScript typecheck failed - fix before completing the session"
      showStdout: true
      showStderr: true
      maxOutputLines: 200

    - run: "pnpm lint"
      message: "eslint reported errors - fix before completing the session"
      showStdout: true
      showStderr: true
      maxOutputLines: 200

    - run: "pnpm format:check"
      message: "prettier: UI code is not formatted - run `pnpm format` before completing"
      showStdout: true
      showStderr: true
      maxOutputLines: 200

    - run: "pnpm test"
      message: "UI tests failed in ui/ - fix before completing the session"
      showStdout: true
      showStderr: true
      maxOutputLines: 200

    - run: "pnpm ui:build"
      message: "UI build failed - fix before completing the session"
      showStdout: true
      showStderr: true
      maxOutputLines: 200

  infinite: false
  infiniteMessage: "continue working on the task"

# Pre-tool-use hook - file protection and tool validation.
preToolUse:
  # CLAUDE.md: "Don't introduce a new top-level directory without coordination."
  preventRootAdditions: true
  preventRootAdditionsMessage: "Pixhaus repo layout is fixed in docs/planning/architecture/stack.md. New top-level paths require a planning-doc revision, not a code change. Place {file_path} in an existing crate or workspace dir."

  # Files that should never be hand-edited.
  uneditableFiles:
    # Lock files - regenerated by their package manager, manual edits cause drift.
    - pattern: "Cargo.lock"
      message: "Cargo.lock is regenerated by cargo. Adjust Cargo.toml dependencies and let cargo update the lock."
    - pattern: "pnpm-lock.yaml"
      message: "pnpm-lock.yaml is regenerated by pnpm. Adjust package.json and run pnpm install."
    - pattern: "**/Cargo.lock"
      message: "Cargo.lock is regenerated by cargo."
    - pattern: "**/pnpm-lock.yaml"
      message: "pnpm-lock.yaml is regenerated by pnpm."

    # Toolchain pin - bumping needs MSRV review per CLAUDE.md.
    - pattern: "rust-toolchain.toml"
      message: "Bumping the toolchain pin can cascade to MSRV. Open a chore PR with reasoning, don't edit silently."

    # Secrets - never commit, never edit through Claude.
    - pattern: ".env"
    - pattern: ".env.*"
    - pattern: "**/.env"
    - pattern: "**/.env.*"

    # Build outputs - never edit by hand.
    - pattern: "target/**"
    - pattern: "**/target/**"
    - pattern: "node_modules/**"
    - pattern: "**/node_modules/**"
    - pattern: "dist/**"
    - pattern: "**/dist/**"

    # The locked stack doc - changing it is a planning revision, not a code change.
    - pattern: "docs/planning/architecture/stack.md"
      message: "The stack is locked. Changes to stack.md require an ADR or planning-doc revision, not a code change."

  # Skip git-ignored files.
  preventUpdateGitIgnored: false

  # Bash command guards. Patterns are globs; matchMode "full" requires whole-command match,
  # "prefix" matches command start. Use prefix for command families.
  toolUsageValidation:
    # CLAUDE.md: "Don't push to `main` directly."
    - tool: "Bash"
      pattern: ""
      commandPattern: "git push origin main*"
      matchMode: "prefix"
      action: "block"
      message: "Pushing directly to origin/main is forbidden. Open a PR from a feature branch."

    - tool: "Bash"
      pattern: ""
      commandPattern: "git push -u origin main*"
      matchMode: "prefix"
      action: "block"
      message: "Pushing directly to origin/main is forbidden. Open a PR from a feature branch."

    # CLAUDE.md / workflow skill: never force-push.
    - tool: "Bash"
      pattern: ""
      commandPattern: "git push --force*"
      matchMode: "prefix"
      action: "block"
      message: "Force push is not allowed in Pixhaus. Resolve the divergence with a merge or a clean rebase before push."

    - tool: "Bash"
      pattern: ""
      commandPattern: "git push -f *"
      matchMode: "prefix"
      action: "block"
      message: "Force push is not allowed in Pixhaus."

    # Workflow skill: "Don't bypass hooks." Match the flag at command-arg
    # boundaries on git verbs that accept it - substring matching catches
    # the flag's name inside doc strings and commit messages too.
    - tool: "Bash"
      pattern: ""
      commandPattern: "git commit*--no-verify*"
      matchMode: "prefix"
      action: "block"
      message: "Bypassing pre-commit hooks is forbidden. Fix the hook in a separate PR if it's wrong."

    - tool: "Bash"
      pattern: ""
      commandPattern: "git push*--no-verify*"
      matchMode: "prefix"
      action: "block"
      message: "Bypassing pre-push hooks is forbidden. Fix the hook in a separate PR if it's wrong."

    - tool: "Bash"
      pattern: ""
      commandPattern: "git rebase*--no-verify*"
      matchMode: "prefix"
      action: "block"
      message: "Bypassing rebase hooks is forbidden. Fix the hook in a separate PR if it's wrong."

    # Workflow skill: "Don't `git rebase -i`".
    - tool: "Bash"
      pattern: ""
      commandPattern: "git rebase -i*"
      matchMode: "prefix"
      action: "block"
      message: "Interactive rebase is blocked - it requires an editor that won't open in this shell."

    # Workflow skill: "Don't `git reset --hard` on a branch others might have based work on".
    - tool: "Bash"
      pattern: ""
      commandPattern: "git reset --hard*"
      matchMode: "prefix"
      action: "block"
      message: "git reset --hard is destructive. Confirm with the user, or use a softer reset."

    # Destructive recursive delete.
    - tool: "Bash"
      pattern: ""
      commandPattern: "rm -rf *"
      matchMode: "prefix"
      action: "block"
      message: "Recursive delete is blocked. If you really need to clean a directory, do it explicitly with the user's say-so."

    - tool: "Bash"
      pattern: ""
      commandPattern: "rm -fr *"
      matchMode: "prefix"
      action: "block"
      message: "Recursive delete is blocked."

    # Wrong package manager - the repo uses pnpm.
    - tool: "Bash"
      pattern: ""
      commandPattern: "npm install*"
      matchMode: "prefix"
      action: "block"
      message: "Pixhaus uses pnpm, not npm. Run pnpm install."

    - tool: "Bash"
      pattern: ""
      commandPattern: "npm i *"
      matchMode: "prefix"
      action: "block"
      message: "Pixhaus uses pnpm, not npm. Run pnpm add <pkg>."

    - tool: "Bash"
      pattern: ""
      commandPattern: "yarn *"
      matchMode: "prefix"
      action: "block"
      message: "Pixhaus uses pnpm, not yarn."

  # No extra add-prevention beyond root - the repo layout is enforced via preventRootAdditions.
  preventAdditions: []

# Notifications stay off by default - flip to true if you want OS popups.
notifications:
  enabled: false
  hooks: []
  showErrors: false
  showSuccess: false
  showSystemEvents: true
