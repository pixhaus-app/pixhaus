[package]
name = "pixhaus-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
anyhow.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
# Decodes the brand icon PNG into egui::IconData for the OS window/taskbar icon.
# The headless render example also reuses it to save snapshot PNGs.
image.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The app owns the single tracing subscriber: a rolling file appender (its writer
# guard must live for all of main) plus the log->tracing bridge for wgpu/winit/naga.
tracing-appender.workspace = true
tracing-log.workspace = true
# Detects the OS language at boot so the app launches localized. See pixhaus-i18n.
sys-locale.workspace = true
pixhaus-platform = { path = "../crates/platform" }
# The domain model. Used directly by the render_workspaces example to seed a small
# Codex (entries, anchors, coverage) so the Codex-workspace snapshot has content.
pixhaus-core = { path = "../crates/core" }
# The localization service: the app sets the active language at boot, the string-side
# parallel to owning the one tracing subscriber.
pixhaus-services = { path = "../crates/services" }
pixhaus-ui = { path = "../crates/ui" }
pixhaus-mod-sprite-edit = { path = "../modules/sprite-edit" }
pixhaus-mod-animation = { path = "../modules/animation" }
pixhaus-mod-tiles = { path = "../modules/tiles" }
pixhaus-mod-generation = { path = "../modules/generation" }
pixhaus-mod-export = { path = "../modules/export" }
pixhaus-mod-codex = { path = "../modules/codex" }
# The offline mock provider, registered into the host's provider registry so the
# Generate workspace answers prompts without an API key or GPU.
pixhaus-mod-providers = { path = "../modules/providers" }

[dev-dependencies]
egui_kittest.workspace = true
# A throwaway log dir for the build_subscriber smoke test, so it never writes to the
# real OS log dir.
tempfile.workspace = true

[lints]
workspace = true
