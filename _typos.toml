# typos config. https://github.com/crate-ci/typos
#
# docs/planning/ is imported reference material from the SpriteMaster
# workspace. It contains many proper nouns (Canva, UE) and abbreviations
# typos can't classify, plus quoted typo examples in articles about
# spell-checking. Excluded wholesale; if those docs ever become live
# specs we maintain, lift the exclusion and address the warnings
# individually.

[files]
extend-exclude = [
    "docs/planning/**",
    # Build artifacts — typos in class names are Astro/Starlight internals, not our content.
    "docs/site/dist/**",
    # Pagefind compiled search bundle — third-party minified JS.
    "docs/site/src/content/docs/**/.astro/**",
]

[default.extend-words]
# "PN" is a valid fragment in the PNG acronym (Portable Network Graphics).
# typos conflates it with the "ON" abbreviation correction.
PN = "PN"
# "Sur" is part of "Big Sur" (macOS 11 codename), not a misspelling of "Sure".
Sur = "Sur"
# `numer_denom_ms` is the upstream image-rs method name on
# image::Delay returning a rational (numerator/denominator) in ms.
numer = "numer"
# m_PVREnvironmentMIS: Unity YAML property for Multiple Importance Sampling.
MIS = "MIS"
# "laf" is the name of Aseprite's UI submodule (https://github.com/aseprite/laf),
# referenced verbatim in `LICENSES/NOTICE.txt` and `LICENSES/aseprite-MIT.txt`.
laf = "laf"
