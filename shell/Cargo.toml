[package]
name = "pixhaus-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Pixhaus native shell — eframe + egui binary (vertical-slice)"

[[bin]]
name = "shell"
path = "src/main.rs"

[dependencies]
pixhaus-core.workspace = true
pixhaus-ai.workspace = true
pixhaus-render.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
anyhow.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
image.workspace = true
rfd.workspace = true
# Pure-Rust mp4 demux + H.264 decode for the image-to-video clip, so the
# animation path needs no external ffmpeg binary. openh264 is BSD-2; mp4 is MIT.
mp4 = "0.14"
openh264 = "0.9"
egui-phosphor = "0.12.0"
# Network HTTP client for the Lospec palette browser. Optional and gated behind
# the `lospec` feature so the default build pulls in no network code; the fetch
# runs on a background thread, never the egui update loop.
reqwest = { workspace = true, optional = true }

[features]
# Off by default. Enables the Lospec palette browser, which fetches a palette by
# slug over HTTP. The only feature in this crate that touches the network.
lospec = ["dep:reqwest"]
# On-device FLUX.2 generation. Forward the backend choice to pixhaus-ai. The
# Windows packaged build compiles with `local-flux-cuda`, macOS with
# `local-flux-metal`; CI's default build leaves all of these off.
local-flux-cuda = ["pixhaus-ai/local-flux-cuda"]
local-flux-metal = ["pixhaus-ai/local-flux-metal"]
local-flux-cpu = ["pixhaus-ai/local-flux-cpu"]

[dev-dependencies]
# Blocks on async wgpu init in the reveal effect's headless GPU smoke test.
pollster.workspace = true
proptest.workspace = true
image-compare.workspace = true
rstest.workspace = true
# Snapshot tests for the atlas export manifest JSON.
insta.workspace = true
# Temp dirs for the durable job-queue recovery round-trip tests.
tempfile.workspace = true

[lints]
workspace = true
