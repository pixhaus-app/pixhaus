[package]
name = "pixhaus-plugin-echo"
version = "0.1.0"
edition = "2024"
authors = ["Pixhaus Team"]
license = "MIT"
description = "Echo verb reference plugin for Pixhaus. Compile to WASM and install as a user plugin."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Extism Plugin Development Kit — provides the #[plugin_fn] macro and
# the host-communication layer (memory, error returns).
extism-pdk = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Build this plugin:
#   cargo build --release --target wasm32-wasip1
#
# Install it:
#   cp target/wasm32-wasip1/release/pixhaus_plugin_echo.wasm \
#      ~/.pixhaus/plugins/echo/echo.wasm
#   cp examples/plugins/echo/plugin.toml \
#      ~/.pixhaus/plugins/echo/plugin.toml
