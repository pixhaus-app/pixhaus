# cargo-deny configuration. Enforces the licensing and supply-chain rules
# from CLAUDE.md: MIT project, no GPL/LGPL/AGPL copyleft dependencies, no
# known-vulnerable or yanked crates, no crates from unknown sources.
#
# Lives under .cargo/ because the repo layout forbids new top-level files
# (see docs/planning/architecture/stack.md). Run with an explicit config path:
#   cargo deny --config .cargo/deny.toml check

[graph]
all-features = true

[advisories]
# Fail on crates with a known security advisory or that have been yanked.
yanked = "deny"
# Only flag "unmaintained" advisories for crates we depend on directly. The
# transitive GTK3 bindings (gdk/gtk/atk/...) that Tauri's Linux webview pulls
# in are flagged unmaintained upstream (RUSTSEC-2024-0411..0420) but are not
# vulnerabilities and are outside our control. Vulnerability/yanked checks
# stay at full strength across the whole tree.
unmaintained = "workspace"
ignore = [
    # wasmtime 41.0.4 advisories, all pulled in transitively by extism 1.21.0
    # (the latest release), which pins wasmtime 41. No semver-compatible fix
    # exists; the upstream fixes land in wasmtime >= 43.0.2. These range from
    # DoS panics to sandbox-escaping memory accesses, so they are reachable
    # ONLY by executing a hostile WASM plugin. Accepted strictly under the
    # trusted-plugin model in docs/planning/architecture/plugin-trust-model.md:
    # Pixhaus must NOT load untrusted/third-party plugins until extism ships a
    # release on a patched wasmtime and these entries are removed. Revisit
    # every time the lockfile's wasmtime version changes.
    "RUSTSEC-2026-0085",
    "RUSTSEC-2026-0086",
    "RUSTSEC-2026-0087",
    "RUSTSEC-2026-0088",
    "RUSTSEC-2026-0089",
    "RUSTSEC-2026-0091",
    "RUSTSEC-2026-0092",
    "RUSTSEC-2026-0093",
    "RUSTSEC-2026-0094",
    "RUSTSEC-2026-0095",
    "RUSTSEC-2026-0096",
    "RUSTSEC-2026-0114",
]

[licenses]
# Only these (permissive, MIT-distribution-compatible) licenses are allowed.
# Anything not listed — notably GPL-2.0/3.0, LGPL, AGPL — fails the check.
# Add a new entry deliberately, the same way the workspace pins `psd`.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    # webpki-roots ships the Mozilla CA bundle under this permissive license.
    "CDLA-Permissive-2.0",
    # libbzip2's permissive (BSD-like) license, pulled in transitively.
    "bzip2-1.0.6",
]
confidence-threshold = 0.8
# Per-crate license exceptions go here if a dependency needs one.
exceptions = []

[bans]
# Surface, but do not fail on, duplicate versions and wildcard deps — these
# are hygiene signals rather than hard errors for an app workspace.
multiple-versions = "warn"
wildcards = "warn"
allow = []
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
