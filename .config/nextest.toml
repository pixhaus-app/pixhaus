# Nextest configuration.
#
# Keychain isolation is NOT configured here. nextest has no top-level `[env]`
# table — it silently ignores one (it only injects env vars from setup scripts
# or Cargo's `[env]` in `.cargo/config.toml`), so an earlier `[env]` block here
# was a no-op and every test still popped the macOS login Keychain dialog.
#
# Instead, ai/src/backends/keys.rs::mock_store_requested() keys off the
# `NEXTEST` variable that cargo-nextest sets in every test process, falling
# back to the in-memory keyring store. No config here has to stay in sync.
