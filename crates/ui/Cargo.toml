[package]
name = "pixhaus-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
egui.workspace = true
egui-wgpu.workspace = true
egui-phosphor.workspace = true
# Image loaders for the brand assets baked in via egui::include_image!. The `image`
# feature pulls `image` with default-features off, so a PNG decoder only compiles if
# some crate activates `image/png` - hence the `image` dep below.
egui_extras = { workspace = true, features = ["image"] }
# Feature-activation only: turns on the PNG decoder egui_extras' image loader needs.
# `ui` never calls `image::*` directly; the OS-icon decode lives in `app`.
image = { workspace = true, features = ["png"] }
wgpu.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The domain model: the live document the shell composites and mutates through
# commands, and the fundamental commands themselves.
pixhaus-core = { path = "../core" }
pixhaus-render = { path = "../render" }
# The localization service (the shell resolves `MsgKey`s to display text at render
# time through `pixhaus_services::i18n`) plus the command/undo, job, and provider
# systems the `EditSession` holds. See the pixhaus-i18n skill.
pixhaus-services = { path = "../services" }

[dev-dependencies]
rstest.workspace = true
insta.workspace = true
# Drives the end-to-end Generate-loop test: a runtime for the spawned job and a
# short sleep while polling the drain.
tokio = { workspace = true }
# The five capability modules, for the integration tests only. These are
# dev-dependencies so the cycle (each module depends on pixhaus-ui) exists only
# in the test/example/bench build, never in the library graph - Cargo allows a
# dev-dependency cycle precisely because it does not affect the normal build.
pixhaus-mod-sprite-edit = { path = "../../modules/sprite-edit" }
pixhaus-mod-animation = { path = "../../modules/animation" }
pixhaus-mod-tiles = { path = "../../modules/tiles" }
pixhaus-mod-generation = { path = "../../modules/generation" }
pixhaus-mod-export = { path = "../../modules/export" }
# The Codex module, for the Codex layout snapshot test only.
pixhaus-mod-codex = { path = "../../modules/codex" }
# The mock provider, registered in the end-to-end Generate-loop test only.
pixhaus-mod-providers = { path = "../../modules/providers" }

[lints]
workspace = true
