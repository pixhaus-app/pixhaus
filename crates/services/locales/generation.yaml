# Localization strings owned by the generation module (pixhaus-mod-generation):
# the Generate workspace, its dock/tray panels, and the `gen.*` command labels.
#
# rust-i18n `_version: 2` layout: each key maps locale -> value; `en` is the
# fallback. English only until a translation lands.
_version: 2

# --- Generate workspace. ---
workspace.generate.title:
  en: Generate
workspace.generate.purpose:
  en: Generate sprites from a prompt
workspace.generate.status.ai-ready:
  en: AI Ready

# --- Prompt composer body (the {variable} tokens are inserted literally, not keys). ---
panel.prompt.describe:
  en: Describe your sprite
panel.prompt.hint:
  en: A knight idle pose, side view. Use {variable} chips.
panel.prompt.variables:
  en: Variables

# --- Results panel body. ---
panel.results.empty:
  en: No results yet. Enter a prompt and click Generate.

