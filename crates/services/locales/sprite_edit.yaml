# Module-owned localization strings for pixhaus-mod-sprite-edit: the Draw
# workspace, the shared editing panels, the 15 editing tools, and the
# sprite/layer/palette/selection/ai/frame command labels and menu groups.
#
# rust-i18n `_version: 2` layout: one file, each key mapping locale -> value. `en`
# is the fallback (services lib.rs: i18n!("locales", fallback = "en")).
_version: 2

# --- Draw workspace meta + status. ---
workspace.draw.title:
  en: Draw
workspace.draw.purpose:
  en: Paint and edit a single sprite
workspace.draw.status.grid_on:
  en: Pixel Grid On

