# Localization strings for the Codex workspace, its panels, commands, and the
# Codex domain vocabulary (entry types, statuses, anchors, relations, coverage,
# validation). Owned by the Codex module (pixhaus-mod-codex); the shell resolves
# these at render time.
#
# rust-i18n `_version: 2` layout: each key maps locale -> value; `en` is the
# fallback. English only until a translation lands.
_version: 2

