# Shell-owned localization strings: the `app.*` namespace (menu bar, chrome,
# dialogs) plus the `command.*` keys for the shell's own menu items. Module-owned
# namespaces live in sibling files (sprite_edit.yaml, animation.yaml, ...).
#
# rust-i18n `_version: 2` layout: one file, each key mapping locale -> value. `en`
# is the fallback (services lib.rs: i18n!("locales", fallback = "en")).
#
# Translator notes: `%{name}` is an interpolation slot - keep it verbatim. Plurals
# are authored as `<key>.one` / `<key>.other` and selected by `i18n::tr_plural`.
# A few keys carry an `es` value as a live example and to exercise the
# language-switch tests; the rest are English-only until a translation lands.
_version: 2

