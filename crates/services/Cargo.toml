[package]
name = "pixhaus-services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# The domain model: command execution and undo run over `core`'s Document.
pixhaus-core = { path = "../core" }
# Typed error enums for the command/undo and job systems.
thiserror = { workspace = true }
# The job system spawns provider work onto the binary's runtime (it never creates
# one) and cancels with a token; serde derives the generation provenance metadata;
# parking_lot guards the shared result store (job task writes, UI lane reads).
# A library declares only the tokio features it uses, not the workspace `full`:
# `rt` for `tokio::spawn`, `macros` for `select!`/`#[tokio::test]`, `time` for
# `time::sleep`. Channels are `std::sync::mpsc`, so `sync` is not needed. The
# version is set directly here rather than `workspace = true` because a `features`
# list on a workspace dependency is additive and could not remove `full`. The
# binary in `app/` keeps the workspace `full`.
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
tokio-util = { workspace = true }
serde = { workspace = true }
parking_lot = { workspace = true }
# The localization service wraps rust-i18n (the `i18n!`/`t!` machinery lives in
# this crate's lib.rs). tracing carries the missing-key warning. See pixhaus-i18n.
rust-i18n = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
rstest = { workspace = true }
# Tests build Codex entries with fields core gates behind `pub(crate)` mutators
# (prompt fragments, aliases, palette refs) by round-tripping a command-built Codex
# through JSON and patching in the extra fields. Test-only.
serde_json = { workspace = true }

[lints]
workspace = true
